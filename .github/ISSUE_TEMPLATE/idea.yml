name: Idea or wish
description: Something you'd like to see in the report
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see, and why?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Which data in Home Assistant could it come from?
      description: e.g. an integration, a sensor type or the energy dashboard
